<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoffeTime - Добро пожаловать</title>
    <link rel="stylesheet" href="assets/styles/index.css">
</head>
<body>
    <main>
        <header>
            <h1 class="logo">CoffeTime</h1>
            <nav>
                <ul>
                    <li><a href="">Главная</a></li>
                    <li><a href="">Меню</a></li>
                    <li><a href="">О нас</a></li>
                </ul>
            </nav>
        </header>
        <div class="content">
            <div class="text-block">
                <h1>КОФЕ <br>НА КАЖДЫЙ</h1>
                <h1 class="day">ДЕНЬ</h1>
                <p class="desc">Спешелти кофе, авторские напитки и чайная карта - <br>для медленных встреч и быстрых пауз</p>
                <div class="buttons">
                    <button class="first_btn">Открыть меню ↓</button>
                    <button class="second_btn">Сделать заказ</button>
                </div>
            </div>
            <img class="coffe_main" alt="coffee_main" src="assets/images/coffe_main.png">
        </div>
        <div class="barista_box">
            <h3>ВЫБОР БАРИСТА</h3>
            <h2>Капучино</h2>
            <p>Классический эспрессо с пышной молочной пеной, бархатистой<br>текстурой и мягким сливочным вкусом.</p>
            <h2>2100 ₸</h2>
        </div>
    </main>
</body>
</html>
